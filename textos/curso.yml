# CURSO FOTO SUB (en el menú, dentro de «Más»). Dirección: /underwater-photo-course/
# Fotos: originales/5-curso-foto-sub/teoria/, practica/ y edicion/ (una en cada carpeta; si hay varias, la primera por nombre).
# Mientras una carpeta esté vacía se usa foto_provisional (ruta dentro de originales/).
# TEXTOS PROVISIONALES: cámbialos por los tuyos (o pásamelos y los traduzco).

antetitulo:
  en: "Underwater photography"
  es: "Fotografía submarina"
  fr: "Photographie sous-marine"

titulo:
  en: "Underwater photo course"
  es: "Curso foto sub"
  fr: "Cours photo sous-marine"

intro:
  en: "Learn to take your own photos underwater: a hands-on course with theory, practice in the water and editing, in small groups and at your own pace."
  es: "Aprende a hacer tus propias fotos bajo el agua: un curso práctico con teoría, práctica en el agua y edición, en grupos pequeños y a tu ritmo."
  fr: "Apprenez à faire vos propres photos sous l'eau : un cours pratique avec théorie, pratique dans l'eau et retouche, en petits groupes et à votre rythme."

# Las tres partes del curso (bandas con foto, como en Tarifa)
# igualar_color: true iguala luz y color de las tres fotos (a la usuaria no le gustó: se dejan originales)
igualar_color: false
partes:
  - carpeta: teoria
    foto_provisional: "1-trabajos/buceo/reportaje/_MG_3060.jpg"
    titulo: { en: "Theory", es: "Teoría", fr: "Théorie" }
    texto:
      en: "Light underwater, camera settings, composition and how to move without disturbing marine life. Tell me your starting point and we'll build from there, adapting the course to your interests."
      es: "La luz bajo el agua, ajustes de cámara, composición y cómo moverte sin molestar a la vida marina. Cuéntame desde qué punto partes y empezamos a construir desde ahí, para adaptar el curso a tus intereses."
      fr: "La lumière sous l'eau, les réglages de l'appareil, la composition et comment se déplacer sans déranger la vie marine. Dites-moi d'où vous partez et nous construirons à partir de là, pour adapter le cours à vos envies."
  - carpeta: practica
    foto_provisional: "1-trabajos/buceo/reportaje/_MG_5822.jpg"
    titulo: { en: "Practice in the water", es: "Práctica en el agua", fr: "Pratique dans l'eau" }
    texto:
      en: "We go into the water together and put everything into practice, step by step. On the first dive we'll do some basic exercises to get comfortable with manual mode and light, and on the second dive you'll be able to make your own decisions and develop a more artistic side. It's very important to know your level and experience underwater too: good buoyancy is essential, out of respect for marine life and for safety."
      es: "Entramos juntos al agua y ponemos todo en práctica, paso a paso. En la primera inmersión practicaremos unos ejercicios básicos para soltarte con el modo manual y la luz, y en el segundo buceo podrás tomar decisiones y desarrollar una parte más artística. Es muy importante saber cuál es tu nivel y tu experiencia también debajo del agua: la flotabilidad es fundamental, por respeto a la vida marina y por seguridad."
      fr: "Nous entrons dans l'eau ensemble et mettons tout en pratique, pas à pas. Lors de la première plongée, nous ferons quelques exercices de base pour être à l'aise avec le mode manuel et la lumière, et lors de la deuxième, vous pourrez prendre vos propres décisions et développer un côté plus artistique. Il est très important de connaître votre niveau et votre expérience sous l'eau : une bonne flottabilité est essentielle, par respect pour la vie marine et pour la sécurité."
  - carpeta: edicion
    recorte: [0, 0.19, 1, 0.71]   # de la foto vertical se usa solo la pantalla con Lightroom (x0, y0, x1, y1 en fracciones)
    foto_provisional: "1-trabajos/buceo/reportaje/_MG_7611.jpg"
    titulo: { en: "Editing", es: "Edición", fr: "Retouche" }
    texto:
      en: "We choose the best photos, try out different ways of organising them and edit them together in different versions, so you can find your personal style. There's no single right way to do it. Think about what you want to convey and what your goal is with each photo."
      es: "Elegimos las mejores fotos, practicamos diferentes sistemas de organización y las editamos juntos en distintas versiones para que puedas encontrar tu estilo personal. No hay una única manera de hacerlo bien. Piensa qué quieres transmitir y cuál es tu objetivo con cada foto."
      fr: "Nous choisissons les meilleures photos, testons différentes façons de les organiser et les retouchons ensemble en plusieurs versions, pour que vous trouviez votre style personnel. Il n'y a pas une seule bonne façon de faire. Pensez à ce que vous voulez transmettre et à votre objectif avec chaque photo."

