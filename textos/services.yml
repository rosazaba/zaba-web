# TARIFA (antes «Servicios»; en el menú: Rates / Tarifa / Tarifs). Dirección: /rates/
# Cada servicio usa la foto de su carpeta en originales/2-servicios/<carpeta>/
# Mientras esa carpeta esté vacía usa foto_provisional (ruta dentro de originales/).
# precio: escribe "" para que ponga "Consultar".

titulo:
  en: "Rates"
  es: "Tarifa"
  fr: "Tarifs"

intro:
  en: "Surf, diving and drone photography on the Atlantic coast. Have a look at each gallery and tell me what you'd like to capture: a session in the water, a dive or the coast seen from above."
  es: "Fotografía de surf, buceo y dron en la costa atlántica. Echa un vistazo a cada galería y cuéntame qué quieres capturar: una sesión en el agua, una inmersión o la costa vista desde el aire."
  fr: "Photographie de surf, de plongée et de drone sur la côte atlantique. Parcourez chaque galerie et dites-moi ce que vous aimeriez capturer : une séance dans l'eau, une plongée ou la côte vue du ciel."

desde:     { en: "Starting at",   es: "Desde",     fr: "À partir de" }
incluye_titulo: { en: "Includes", es: "Incluye", fr: "Inclus" }
consultar: { en: "Price on request", es: "Consultar", fr: "Sur demande" }

lista:
  - carpeta: surf
    foto_provisional: "1-trabajos/surf/DSC05129.jpg"
    titulo: { en: "Surf session", es: "Sesión de surf", fr: "Séance de surf" }
    precio: "120 €"
    texto:
      en: "I shoot you surfing from the water or the beach. Perfect for keeping a memory of your trip or tracking your progress."
      es: "Te fotografío surfeando desde el agua o desde la playa. Ideal para guardar el recuerdo de tu viaje o ver tu progresión."
      fr: "Je vous photographie en train de surfer depuis l'eau ou la plage. Idéal pour garder un souvenir de votre voyage ou suivre vos progrès."
    incluye:
      en: ["1.5 hours in the water", "40+ edited photos", "Online gallery within 72 h"]
      es: ["1,5 horas en el agua", "Más de 40 fotos editadas", "Galería online en 72 h"]
      fr: ["1 h 30 dans l'eau", "Plus de 40 photos retouchées", "Galerie en ligne sous 72 h"]

  - carpeta: buceo
    foto_provisional: "1-trabajos/buceo/_MG_3060.jpg"
    titulo: { en: "Underwater session", es: "Sesión submarina", fr: "Séance sous-marine" }
    precio: "180 €"
    texto:
      en: "Photos of your dive, your course or your freediving session, with natural light and a calm, safe approach."
      es: "Fotos de tu inmersión, tu curso o tu sesión de apnea, con luz natural y un enfoque tranquilo y seguro."
      fr: "Photos de votre plongée, de votre formation ou de votre séance d'apnée, en lumière naturelle et en toute sécurité."
    incluye:
      en: ["One or two dives", "30+ edited photos", "Online gallery within 72 h"]
      es: ["Una o dos inmersiones", "Más de 30 fotos editadas", "Galería online en 72 h"]
      fr: ["Une ou deux plongées", "Plus de 30 photos retouchées", "Galerie en ligne sous 72 h"]

  - carpeta: copias
    foto_provisional: "1-trabajos/dron/IMG_20260907_09553035.jpeg"
    titulo: { en: "Fine art prints", es: "Copias artísticas", fr: "Tirages d'art" }
    precio: "45 €"
    texto:
      en: "Any photo from the galleries, printed on premium paper. Ask me about sizes and framing."
      es: "Cualquier foto de las galerías, impresa en papel de alta calidad. Pregúntame por tamaños y enmarcado."
      fr: "N'importe quelle photo des galeries, imprimée sur papier haut de gamme. Demandez-moi les formats et l'encadrement."
    incluye:
      en: ["Museum-grade paper", "Signed and numbered", "Shipping available"]
      es: ["Papel de calidad museo", "Firmadas y numeradas", "Envío disponible"]
      fr: ["Papier qualité musée", "Signés et numérotés", "Livraison possible"]

pasos_antetitulo: { en: "Next steps", es: "Próximos pasos", fr: "Prochaines étapes" }
pasos_titulo: { en: "How it works", es: "Cómo funciona", fr: "Comment ça marche" }
pasos:
  - titulo: { en: "Tell me your idea", es: "Cuéntame tu idea", fr: "Racontez-moi votre idée" }
    texto:
      en: "Send me a message with the place, dates and what you'd like."
      es: "Envíame un mensaje con el lugar, las fechas y lo que te gustaría."
      fr: "Envoyez-moi un message avec le lieu, les dates et vos envies."
  - titulo: { en: "We pick the window", es: "Elegimos el momento", fr: "On choisit le créneau" }
    texto:
      en: "I check the forecast and we choose the best day and time together."
      es: "Miro la previsión y elegimos juntos el mejor día y la mejor hora."
      fr: "Je consulte les prévisions et nous choisissons ensemble le meilleur jour et la meilleure heure."
  - titulo: { en: "Shoot & deliver", es: "Fotos y entrega", fr: "Shooting et livraison" }
    texto:
      en: "We shoot, I edit, and you receive your private online gallery."
      es: "Hacemos las fotos, las edito y recibes tu galería online privada."
      fr: "On shoote, je retouche, et vous recevez votre galerie privée en ligne."

# Encuadre de la foto de arriba: "horizontal vertical" en %. 50% 50% = centrada;
# vertical más bajo (p. ej. 25%) enseña más la parte de arriba de la foto, más alto (75%) la de abajo.
portada_encuadre: "25% 70%"   # se ve el surfista entero, con los pies
portada_lado: "derecha"      # izquierda o derecha: dónde va el título sobre la foto (a la derecha para no tapar al surfista)
