# ENCUENTRA TUS FOTOS. Dirección: /find-your-photos/
# Fotos: originales/7-encuentra-tus-fotos/<carpeta de la playa>/<AAAA-MM-DD>/  (una carpeta por sesión)
#        originales/7-encuentra-tus-fotos/portada/ → foto (opcional) de la cabecera.
# En la web solo salen pequeñas y con marca de agua; cada foto lleva un código (p. ej. PATOS-20261101-007).
# Al pulsar «Comprar», el cliente te escribe por WhatsApp con ese código. Tú cobras y le envías la foto original.

precio_foto: "000 €"

# Playas. Para añadir una: crea su carpeta en originales/7-encuentra-tus-fotos/ y copia un bloque.
#   carpeta: nombre de la carpeta · codigo: prefijo corto en MAYÚSCULAS para los códigos de las fotos
localizaciones:
  - carpeta: "playa-de-berria-santona"
    codigo: "BERRIA"
    nombre: "Playa de Berria"
    lugar: "Santoña"

titulo:
  en: "Find your photos"
  es: "Encuentra tus fotos"
  fr: "Trouvez vos photos"

antetitulo:
  en: "Were you in the water?"
  es: "¿Estuviste en el agua?"
  fr: "Vous étiez à l'eau ?"

intro:
  en: "Search by beach and date, find yourself and buy your photo. You'll receive it in full resolution and without watermark."
  es: "Busca por playa y fecha, encuéntrate y compra tu foto. Te la envío en alta resolución y sin marca de agua."
  fr: "Cherchez par plage et par date, retrouvez-vous et achetez votre photo. Vous la recevez en haute résolution et sans filigrane."

buscar: { en: "Search beach, town or date (e.g. 01/11/2026)", es: "Busca playa, pueblo o fecha (p. ej. 01/11/2026)", fr: "Cherchez plage, ville ou date (ex. 01/11/2026)" }
todas:  { en: "All", es: "Todas", fr: "Toutes" }
