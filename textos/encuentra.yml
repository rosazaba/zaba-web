aviso_subida:
  en: "Photos are uploaded the evening of the session or the next morning."
  es: "Las fotos se suben la misma tarde de la sesión o a la mañana siguiente."
  fr: "Les photos sont publiées le soir de la séance ou le lendemain matin."
aviso_legal:
  en: "Photos taken in a public sports setting, shown only so that you can find and buy your own. If you'd like one removed, write to me and I'll delete it."
  es: "Fotos tomadas en un entorno deportivo público y publicadas solo para que puedas encontrar y comprar las tuyas. Si quieres que retire alguna, escríbeme y la borro."
  fr: "Photos prises dans un cadre sportif public, publiées uniquement pour que vous puissiez retrouver et acheter les vôtres. Pour en retirer une, écrivez-moi et je la supprime."
