# VIAJES (en el menú, dentro de «Más»). Dirección: /trips/
# Fotos: originales/8-viajes/<carpeta>/ (una por viaje; si hay varias, la primera por nombre).
#        Mientras una carpeta esté vacía se usa foto_provisional (ruta dentro de originales/).
#        originales/8-viajes/anteriores/: fotos de viajes ya hechos (si hay, salen en una tira al final).
# fechas vacío ("") → sale «Fechas por confirmar». TEXTOS PROVISIONALES.

antetitulo: { en: "Community", es: "Comunidad", fr: "Communauté", de: "Gemeinschaft" }
titulo: { en: "Trips", es: "Viajes", fr: "Voyages", de: "Reisen" }
descripcion_google:
  en: "Underwater photography trips and trainings with Zaba: Fuerteventura, the Maldives and more destinations."
  es: "Viajes y formaciones de fotografía submarina con Zaba: Fuerteventura, Maldivas y más destinos."
  fr: "Voyages et formations de photographie sous-marine avec Zaba : Fuerteventura, les Maldives et d'autres destinations."
  de: "Unterwasserfotografie-Reisen und Trainings mit Zaba: Fuerteventura, die Malediven und weitere Ziele."
intro:
  en: "Trips to learn, dive and create together: small groups, the sea as a classroom and photos to remember them by."
  es: "Viajes para aprender, bucear y crear juntos: grupos pequeños, el mar como aula y fotos para recordarlos."
  fr: "Des voyages pour apprendre, plonger et créer ensemble : petits groupes, la mer comme salle de classe et des photos pour s'en souvenir."
  de: "Reisen, um gemeinsam zu lernen, zu tauchen und kreativ zu sein: kleine Gruppen, das Meer als Klassenzimmer und Fotos, die bleiben."

