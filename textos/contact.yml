# CONTACTO

titulo:
  en: "Contact"
  es: "Contacto"
  fr: "Contact"

intro:
  en: "Planning a session or want a print? Write to me and I'll get back to you soon."
  es: "¿Quieres una sesión o una copia impresa? Escríbeme y te respondo pronto."
  fr: "Une séance ou un tirage ? Écrivez-moi et je vous réponds rapidement."

formulario:
  nombre:   { en: "First name",            es: "Nombre",               fr: "Prénom" }
  apellidos: { en: "Last name",            es: "Apellidos",            fr: "Nom" }
  email:    { en: "Email",                 es: "Email",                fr: "E-mail" }
  servicio: { en: "Subject",               es: "Asunto a tratar",      fr: "Sujet" }
  mensaje:  { en: "Message",               es: "Mensaje",              fr: "Message" }
  enviar:   { en: "Send message",          es: "Enviar mensaje",       fr: "Envoyer le message" }
  gracias:  { en: "Thank you! I'll reply very soon.", es: "¡Gracias! Te respondo muy pronto.", fr: "Merci ! Je vous réponds très vite." }
  error:    { en: "Something went wrong. Please email me directly.", es: "Algo ha fallado. Escríbeme directamente por email.", fr: "Une erreur s'est produite. Écrivez-moi directement par e-mail." }

# Opciones de «Asunto a tratar» (valor: texto en cada idioma)
intereses:
  surf:  { en: "Surf",   es: "Surf",  fr: "Surf" }
  buceo: { en: "Diving", es: "Buceo", fr: "Plongée" }
  dron:  { en: "Drone",  es: "Dron",  fr: "Drone" }

llamar:   { en: "Call",     es: "Llamar",   fr: "Appeler" }
whatsapp: { en: "WhatsApp", es: "WhatsApp", fr: "WhatsApp" }

directo:
  en: "Message me"
  es: "Escríbeme"
  fr: "Écrivez-moi"

formulario_titulo:
  en: "Tell me about your idea"
  es: "Cuéntame tu idea"
  fr: "Parlez-moi de votre idée"

# Fondo-mural: foto de originales/4-contacto/portada/ en transparencia sobre un color sólido
mural_color: "mar"        # mar (azul verdoso), topo, arena-2, ocre…
mural_opacidad: 0.28      # 0 = no se ve la foto, 1 = foto sin transparencia

# Encuadre de la foto de arriba: "horizontal vertical" en %. 50% 50% = centrada;
# vertical más bajo (p. ej. 25%) enseña más la parte de arriba de la foto, más alto (75%) la de abajo.
portada_encuadre: "65% 25%"   # se ve la cresta de la ola y la montaña
