formulario:
  nombre:   { en: "Name",                  es: "Nombre",               fr: "Nom" }
  email:    { en: "Email",                 es: "Email",                fr: "E-mail" }
  servicio: { en: "I'm interested in",     es: "Me interesa",          fr: "Je suis intéressé·e par" }
  mensaje:  { en: "Message",               es: "Mensaje",              fr: "Message" }
  enviar:   { en: "Send message",          es: "Enviar mensaje",       fr: "Envoyer le message" }
