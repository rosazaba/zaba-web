#   Si no hay, se usa la indicada aquí (ruta dentro de originales/):
portada_foto: ""
# Girar esa foto (en grados, sentido del reloj): 0, 90, 180 o 270
portada_girar: 0
# Tira de fotos «Selección»: originales/1-trabajos/seleccion/  (opcional; salen en el orden de sus nombres)
