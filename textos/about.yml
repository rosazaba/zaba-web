# SOBRE MÍ
# Fotos: originales/3-sobre-mi/
#   portada/   -> la foto apaisada de arriba (horizontal), dentro de la carpeta «portada»
#   retrato-…  -> tu foto del bloque «¡Hola! Soy Rosa» (mejor vertical)
# Mientras no haya fotos tuyas se usan las de «provisional» (fotos de tus galerías).

titulo:
  en: "About me"
  es: "Sobre mí"
  fr: "À propos"

# ── 1. Foto de arriba con cita ──────────────────────────────
mostrar_portada: false   # la usuaria la quitó: la página empieza con el bloque oscuro «¡Hola! Soy Rosa». true = vuelve a salir
cita:
  en: "The sea, once it casts its spell, holds one in its net of wonder forever."
  es: "El mar, una vez que lanza su hechizo, te atrapa para siempre en su red de maravillas."
  fr: "La mer, une fois qu'elle a jeté son sort, vous retient à jamais dans son filet de merveilles."
cita_autor: "Jacques-Yves Cousteau"
cita_lado: "izquierda"        # izquierda o derecha: dónde va la cita sobre la foto

# ── 2. ¡Hola! Soy Rosa ──────────────────────────────────────
hola_titulo:
  en: "Hi! I'm Rosa"
  es: "¡Hola! Soy Rosa"
  fr: "Bonjour ! Je suis Rosa"

hola_subtitulo:
  en: "The person behind the lens"
  es: "Quién está detrás de la lente"
  fr: "Derrière l'objectif"

# Tu historia. Cada línea es un párrafo. (Texto de Rosa)
parrafos:
  en:
    - "Walking barefoot, salt-kissed and close to the sea as a way of life. That this is my work uniform is crazy. My great passions are the sea, photography and sport. Being able to bring them all together and turn them into a profession, coming from Toledo, hasn't been luck."
    - "I've been a diving instructor for more than 8 years. For over three years I've worked professionally in underwater photography, and I'm making my way as a surf photographer while never stopping learning."
  es:
    - "Andar descalza, ensalitrada y cerca del mar como estilo de vida. Que sea mi uniforme de trabajo es una locura. Mis grandes pasiones son el mar, la fotografía y el deporte. Poder mezclarlo todo y hacer de ello una profesión siendo de Toledo no ha sido suerte."
    - "Soy instructora de buceo desde hace más de 8 años. Llevo más de tres años dedicándome a la fotografía submarina de manera profesional y abriéndome camino como fotógrafa de surf, sin dejar de formarme."
  fr:
    - "Marcher pieds nus, le sel sur la peau et près de la mer, comme mode de vie. Que ce soit mon uniforme de travail, c'est fou. Mes grandes passions sont la mer, la photographie et le sport. Pouvoir tout réunir et en faire mon métier en venant de Tolède, ce n'est pas une question de chance."
    - "Je suis monitrice de plongée depuis plus de 8 ans. Depuis plus de trois ans, je me consacre professionnellement à la photographie sous-marine et je me fais une place comme photographe de surf, sans jamais cesser de me former."

# ── 3. Mi propósito ─────────────────────────────────────────  (TEXTO PROVISIONAL)
proposito_titulo:
  en: "My purpose"
  es: "Mi propósito"
  fr: "Ma démarche"

proposito_texto:   # (texto de Rosa)
  en: "Freezing a moment that lasts only seconds, and moving whoever wants to keep it forever without saying a word."
  es: "Congelar un instante que dura segundos, y emocionar sin decir una palabra a quien lo quiera tener para siempre."
  fr: "Figer un instant qui ne dure que quelques secondes, et émouvoir sans un mot celui qui veut le garder pour toujours."

# Los 3 puntos de debajo de «Mi propósito»: título, frase corta y, si se rellena «mas», un botón «Más» que abre el resto del texto y sus botones
ver_mas: { en: "More", es: "Más", fr: "Plus" }
objetivos:
  - titulo: { en: "Real moments",       es: "Momentos reales",        fr: "Des moments vrais" }
    texto:
      en: "No poses: I look for the instant that tells your session as it was."
      es: "Sin poses: busco el instante que cuenta tu sesión tal y como fue."
      fr: "Pas de poses : je cherche l'instant qui raconte votre session telle qu'elle a été."
    # mas / botones: pendiente (lo manda Rosa); mismo formato que el punto 3
  - titulo: { en: "Respect for the sea", es: "Respeto por el mar",     fr: "Le respect de la mer" }
    texto:
      en: "I photograph without disturbing marine life and following good diving practice."
      es: "Fotografío sin molestar a la vida marina y siguiendo las buenas prácticas de buceo."
      fr: "Je photographie sans déranger la vie marine, en respectant les bonnes pratiques de plongée."
    # mas / botones: pendiente (lo manda Rosa); mismo formato que el punto 3
  - titulo: { en: "Reaching more people", es: "Llegar a más gente", fr: "Toucher plus de monde" }   # (texto de Rosa)
    texto:
      en: "If you can dream it, you can do it."
      es: "Si lo puedes soñar, lo puedes hacer."
      fr: "Si vous pouvez le rêver, vous pouvez le faire."
    # mas: el texto que se abre con el botón «Más» (vacío = no sale el botón)
    mas:
      en: "I'm a photographer who never studied photography. I worked as an underwater photographer without having taken a single photo above water. It's never too late for anything. If you don't know how to start, write to me and I'll tell you how I did it."
      es: "Soy fotógrafa sin haber estudiado fotografía. Trabajé como fotógrafa submarina sin haber hecho ni una foto en superficie. Siempre estás a tiempo de todo. Si no sabes cómo empezar, escríbeme y te cuento cómo lo hice yo."
      fr: "Je suis photographe sans avoir étudié la photographie. J'ai travaillé comme photographe sous-marine sans avoir pris une seule photo en surface. Il n'est jamais trop tard pour rien. Si vous ne savez pas par où commencer, écrivez-moi et je vous raconte comment je l'ai fait."
    # botones debajo del texto que se abre (destino: curso, contact, services, print, encuentra, about o inicio)
    botones:
      - { destino: curso,   texto: { en: "Underwater photo course", es: "Curso foto sub", fr: "Cours photo sous-marine" } }
      - { destino: contact, texto: { en: "Let's talk", es: "Hablamos", fr: "Parlons-en" } }

# Pequeños datos (etiqueta + valor)
datos:
  - etiqueta: { en: "Based in", es: "Vivo en", fr: "Où" }
    valor:    { en: "Spain",    es: "España", fr: "Espagne" }
  - etiqueta: { en: "In the water", es: "En el agua", fr: "Dans l'eau" }
    valor:    { en: "Surf · Scuba · Freediving", es: "Surf · Buceo · Apnea", fr: "Surf · Plongée · Apnée" }
  - etiqueta: { en: "Languages", es: "Idiomas", fr: "Langues" }
    valor:    { en: "English · Español", es: "English · Español", fr: "English · Español" }

# Fotos provisionales mientras no haya fotos tuyas en originales/3-sobre-mi/ (rutas dentro de originales/)
provisional:
  portada: "1-trabajos/buceo/_MG_8142.jpg"
  retrato: "3-sobre-mi/portada/IMG_20221225_181806_612.jpg"   # retrato del bloque «Hola»: la misma foto de la portada (elegido por Rosa)

# Encuadre de la foto de arriba: "horizontal vertical" en %. 50% 50% = centrada;
# vertical más bajo (p. ej. 25%) enseña más la parte de arriba de la foto, más alto (75%) la de abajo.
portada_encuadre: "50% 50%"
retrato_encuadre: "60% 50%"   # foto del bloque «¡Hola! Soy Rosa»: "horizontal vertical" en %; más bajo el primero = se ve más la parte izquierda
