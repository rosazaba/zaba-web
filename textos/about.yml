# SOBRE MÍ
# Tu foto: originales/3-sobre-mi/  (pon UNA foto tuya, mejor vertical)

titulo:
  en: "About me"
  es: "Sobre mí"
  fr: "À propos"

entradilla:
  en: "I grew up with salt in my hair and a camera in my hand."
  es: "Crecí con sal en el pelo y una cámara en la mano."
  fr: "J'ai grandi avec du sel dans les cheveux et un appareil photo à la main."

# Cada línea es un párrafo
parrafos:
  en:
    - "I'm Zaba, a surf and underwater photographer. What started as filming friends in the line-up turned into a way of life: reading forecasts, waking up before sunrise and spending hours in the water waiting for the right moment."
    - "Below the surface I found a different kind of quiet. Diving taught me patience and respect for the ocean — and that the best images come when you blend in rather than chase."
    - "Today I work with surfers and divers who want honest, luminous images of their time in the sea."
  es:
    - "Soy Zaba y me dedico a la fotografía de surf y submarina. Lo que empezó grabando a mis amigos en el pico se convirtió en una forma de vida: mirar previsiones, levantarme antes del amanecer y pasar horas en el agua esperando el momento justo."
    - "Bajo la superficie encontré otro tipo de calma. El buceo me enseñó paciencia y respeto por el océano, y que las mejores imágenes llegan cuando te integras en lugar de perseguir."
    - "Hoy trabajo con surfistas y buceadores que quieren imágenes honestas y luminosas de su tiempo en el mar."
  fr:
    - "Je suis Zaba, photographe de surf et sous-marin. Ce qui a commencé en filmant mes amis au line-up est devenu un mode de vie : lire les prévisions, se lever avant le soleil et passer des heures dans l'eau à attendre le bon moment."
    - "Sous la surface, j'ai trouvé un autre calme. La plongée m'a appris la patience et le respect de l'océan — et que les meilleures images viennent quand on se fond dans le décor plutôt que de courir après."
    - "Aujourd'hui, je travaille avec des surfeurs et des plongeurs qui veulent des images sincères et lumineuses de leurs moments en mer."

