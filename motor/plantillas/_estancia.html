{# Estancia ilustrada (salón o dormitorio) con la foto «e.foto» enmarcada en la pared.
   Moderna, limpia y luminosa: paredes claras, madera natural, luz de ventana. #}
{% set img = asset(e.foto.srcset[[1, e.foto.srcset|length - 1]|min][1]) %}
{% set uid = e.tipo %}
<svg class="estancia__svg" viewBox="0 0 1200 760" role="img" aria-label="{{ T(tienda.estancias[e.tipo]) }} — {{ g.marca }}">
  <defs>
    <linearGradient id="pared-{{ uid }}" x1="0" x2="1" y1="0" y2="0">
      {% if e.tipo == 'salon' %}<stop offset="0" stop-color="#FBF8F2"/><stop offset=".55" stop-color="#F3EDE4"/><stop offset="1" stop-color="#ECE4D8"/>
      {% else %}<stop offset="0" stop-color="#ECE5DA"/><stop offset=".5" stop-color="#F3EEE6"/><stop offset="1" stop-color="#FAF7F1"/>{% endif %}
    </linearGradient>
    <linearGradient id="suelo-{{ uid }}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#E2D2BC"/><stop offset="1" stop-color="#D6C3A8"/>
    </linearGradient>
    <linearGradient id="luz-{{ uid }}" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra-{{ uid }}" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5a4632" flood-opacity=".22"/>
    </filter>
    <filter id="sombra-suave-{{ uid }}" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- pared y suelo -->
  <rect width="1200" height="760" fill="url(#pared-{{ uid }})"/>
  <rect y="612" width="1200" height="148" fill="url(#suelo-{{ uid }})"/>
  <rect y="604" width="1200" height="10" fill="#F7F3EC"/>
  {% for x in range(0, 1200, 150) %}<line x1="{{ x }}" y1="614" x2="{{ x - 60 }}" y2="760" stroke="#CDB89B" stroke-width="1" opacity=".5"/>{% endfor %}

  {% if e.tipo == 'salon' %}
  <!-- ventana y luz -->
  <rect x="40" y="70" width="190" height="500" fill="#F9FBFB" stroke="#FFFFFF" stroke-width="10"/>
  <line x1="135" y1="70" x2="135" y2="570" stroke="#FFFFFF" stroke-width="6"/>
  <rect x="40" y="70" width="190" height="500" fill="#DDE9E8" opacity=".35"/>
  <rect x="22" y="56" width="34" height="550" rx="6" fill="#EFE8DC"/>
  <polygon points="230,90 230,560 760,760 420,760" fill="url(#luz-{{ uid }})" opacity=".55"/>
  <!-- alfombra -->
  <ellipse cx="720" cy="690" rx="400" ry="52" fill="#EFE8DC"/>
  <!-- cuadro -->
  <g>
    <rect x="510" y="130" width="440" height="300" fill="#C7A57B"/>
    <rect x="522" y="142" width="416" height="276" fill="#FFFFFF"/>
  </g>
  <image href="{{ img }}" x="550" y="168" width="360" height="224" preserveAspectRatio="xMidYMid slice"/>
  <rect x="550" y="168" width="360" height="224" fill="none" stroke="#000" stroke-opacity=".06"/>
  <!-- sofá -->
  <ellipse cx="730" cy="612" rx="330" ry="16" fill="#8a7560" opacity=".25" filter="url(#sombra-suave-{{ uid }})"/>
  <rect x="440" y="455" width="580" height="110" rx="38" fill="#DCD4C8"/>
  <rect x="400" y="500" width="70" height="100" rx="30" fill="#D3CABD"/>
  <rect x="990" y="500" width="70" height="100" rx="30" fill="#D3CABD"/>
  <rect x="455" y="520" width="550" height="70" rx="22" fill="#E6DFD4"/>
  <rect x="470" y="470" width="150" height="62" rx="24" fill="#EAE4DA"/>
  <rect x="640" y="468" width="160" height="64" rx="24" fill="#E9E2D7"/>
  <rect x="820" y="474" width="150" height="58" rx="24" fill="#C9B79C"/>
  <rect x="440" y="590" width="10" height="22" fill="#8C6E50"/><rect x="1010" y="590" width="10" height="22" fill="#8C6E50"/>
  <!-- mesa baja -->
  <rect x="620" y="640" width="230" height="16" rx="8" fill="#C7A57B"/>
  <rect x="640" y="656" width="8" height="40" fill="#A98760"/><rect x="822" y="656" width="8" height="40" fill="#A98760"/>
  <circle cx="700" cy="628" r="12" fill="#3E7C78" opacity=".85"/>
  <rect x="740" y="624" width="70" height="14" rx="3" fill="#E7A284" opacity=".8"/>
  <!-- planta -->
  <path d="M328 612 l10 -86 h60 l10 86 z" fill="#E8DFD2"/>
  <g fill="#7E9C83">
    <ellipse cx="352" cy="470" rx="22" ry="62" transform="rotate(-22 352 470)"/>
    <ellipse cx="392" cy="452" rx="20" ry="70" transform="rotate(14 392 452)"/>
    <ellipse cx="372" cy="430" rx="18" ry="66" transform="rotate(-4 372 430)" fill="#6C8B72"/>
    <ellipse cx="410" cy="492" rx="18" ry="48" transform="rotate(38 410 492)" fill="#90AD94"/>
  </g>
  <!-- lámpara de pie -->
  <line x1="1110" y1="612" x2="1110" y2="300" stroke="#2E2925" stroke-width="5"/>
  <path d="M1110 300 Q 1110 230 1050 236" fill="none" stroke="#2E2925" stroke-width="5"/>
  <path d="M1010 236 h80 l-14 44 h-52 z" fill="#EDE6DA"/>
  <ellipse cx="1110" cy="612" rx="30" ry="6" fill="#2E2925"/>
  {% else %}
  <!-- ventana a la derecha y luz -->
  <rect x="975" y="80" width="180" height="480" fill="#F9FBFB" stroke="#FFFFFF" stroke-width="10"/>
  <rect x="975" y="80" width="180" height="480" fill="#DDE9E8" opacity=".35"/>
  <rect x="1148" y="64" width="34" height="540" rx="6" fill="#EFE8DC"/>
  <polygon points="975,100 975,550 420,760 760,760" fill="url(#luz-{{ uid }})" opacity=".5"/>
  <!-- lámparas colgantes -->
  <line x1="250" y1="0" x2="250" y2="250" stroke="#2E2925" stroke-width="2"/>
  <circle cx="250" cy="270" r="26" fill="#EDE6DA"/>
  <line x1="850" y1="0" x2="850" y2="250" stroke="#2E2925" stroke-width="2"/>
  <circle cx="850" cy="270" r="26" fill="#EDE6DA"/>
  <!-- cuadro -->
  <g>
    <rect x="360" y="110" width="380" height="262" fill="#FFFFFF" stroke="#E5DED3" stroke-width="2"/>
  </g>
  <rect x="368" y="118" width="364" height="246" fill="#FFFFFF"/>
  <image href="{{ img }}" x="396" y="144" width="308" height="194" preserveAspectRatio="xMidYMid slice"/>
  <rect x="396" y="144" width="308" height="194" fill="none" stroke="#000" stroke-opacity=".06"/>
  <!-- cama -->
  <ellipse cx="550" cy="700" rx="360" ry="18" fill="#8a7560" opacity=".22" filter="url(#sombra-suave-{{ uid }})"/>
  <rect x="300" y="400" width="500" height="200" rx="20" fill="#C7A57B"/>
  <rect x="265" y="560" width="570" height="130" rx="16" fill="#FBF9F5"/>
  <rect x="265" y="600" width="570" height="90" rx="14" fill="#F1ECE3"/>
  <path d="M265 630 h570 v44 a16 16 0 0 1 -16 16 h-538 a16 16 0 0 1 -16 -16 z" fill="#D9CCB8"/>
  <rect x="320" y="500" width="200" height="74" rx="26" fill="#FFFFFF"/>
  <rect x="580" y="500" width="200" height="74" rx="26" fill="#FFFFFF"/>
  <rect x="440" y="520" width="220" height="62" rx="24" fill="#E7A284" opacity=".55"/>
  <rect x="275" y="690" width="10" height="20" fill="#8C6E50"/><rect x="815" y="690" width="10" height="20" fill="#8C6E50"/>
  <!-- mesillas -->
  {% for x in [150, 860] %}
  <rect x="{{ x }}" y="540" width="100" height="90" rx="8" fill="#E8DFD2"/>
  <line x1="{{ x + 10 }}" y1="585" x2="{{ x + 90 }}" y2="585" stroke="#D3C6B3" stroke-width="2"/>
  <rect x="{{ x + 8 }}" y="630" width="6" height="40" fill="#A98760"/><rect x="{{ x + 86 }}" y="630" width="6" height="40" fill="#A98760"/>
  {% endfor %}
  <rect x="180" y="512" width="40" height="28" rx="4" fill="#3E7C78" opacity=".8"/>
  <path d="M885 540 l8 -40 h34 l8 40 z" fill="#FBF8F2" stroke="#E2D7C6"/>
  <path d="M905 500 c-14 -30 4 -50 14 -60 c4 22 14 30 0 60z" fill="#7E9C83"/>
  {% endif %}
</svg>
